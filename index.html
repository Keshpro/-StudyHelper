<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StudyHelper v2</title><style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#dde2ea;--text:#171c26;--muted:#5d677a;--accent:#2f7d46;--ac-bg:#e3f3e7;--ac-fg:#fff;--sec:#e8ecf2;--danger:#b3263f;--warn:#a86a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101318;--panel:#1a1f29;--line:#2e3542;--text:#f1f3f8;--muted:#a5adbd;--accent:#b9f58b;--ac-bg:#243424;--ac-fg:#14200d;--sec:#2b3340;--danger:#ff9fb3;--warn:#ffcf70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101318;--panel:#1a1f29;--line:#2e3542;--text:#f1f3f8;--muted:#a5adbd;--accent:#b9f58b;--ac-bg:#243424;--ac-fg:#14200d;--sec:#2b3340;--danger:#ff9fb3;--warn:#ffcf70;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:var(--accent);color:var(--ac-fg);border:0;border-radius:10px;padding:10px 15px;font-weight:650;min-height:40px}button:hover{filter:brightness(1.08)}button.sec{background:var(--sec);color:var(--text)}button.dng{background:transparent;color:var(--danger)}button.sm{padding:4px 10px;min-height:32px;font-size:13px}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:40px}textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
aside{position:fixed;inset:0 auto 0 0;width:232px;padding:24px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;z-index:5}
.brand{font-weight:800;font-size:20px;color:var(--accent);padding:0 10px}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav{display:grid;gap:4px;margin-top:26px}nav button{display:flex;gap:10px;align-items:center;background:transparent;color:var(--muted);text-align:left;font-weight:600}nav button.on{background:var(--ac-bg);color:var(--accent)}nav .i{width:22px;text-align:center}
.foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted)}
main{margin-left:232px;padding:28px 32px 60px;max-width:1180px}
h1{font-size:30px;letter-spacing:-.8px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{margin:0}p{color:var(--muted);margin:6px 0}small,.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.hero{background:linear-gradient(115deg,var(--ac-bg),var(--panel));border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:6px}.hero h1{margin:6px 0}
.stat{font-size:30px;font-weight:750;margin:4px 0;letter-spacing:-.5px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.center{text-align:center;justify-content:center}
.bar{height:8px;background:var(--sec);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 2px 2px 0;color:var(--muted)}.badge.on{color:var(--accent);border-color:var(--accent)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}.week div{flex:1;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.week i{display:block;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;opacity:.85}
.tip{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}.tip:first-of-type{border:0}
.topic{padding:10px 0;border-top:1px solid var(--line)}.topic input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent);flex:none}.done{text-decoration:line-through;color:var(--muted)}
.lv1{color:var(--accent)}.lv2{color:var(--warn)}.lv3{color:var(--danger)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.clock{font-size:clamp(56px,14vw,110px);font-weight:750;letter-spacing:-3px;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:20px;border:2px dashed var(--line);border-radius:16px;margin:12px 0;white-space:pre-wrap}
.orb{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ddffc9,#78b991 65%,#476d65);margin:50px auto;transition:transform 4s ease}.orb.big{transform:scale(1.45)}
.game{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:12px auto}.game button{aspect-ratio:1;background:var(--sec);color:var(--text);font-size:24px;padding:0}.game button.m{background:var(--ac-bg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none;gap:12px;align-items:center;max-width:92vw}#toast button{background:transparent;color:var(--bg);text-decoration:underline;padding:0;min-height:0}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
@media(max-width:820px){aside{inset:auto 0 0 0;width:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}.brand,.foot{display:none}nav{display:flex;margin:0;width:100%;gap:0}nav button{flex:1;flex-direction:column;gap:0;padding:6px 0;font-size:10px;text-align:center;min-height:50px;justify-content:center}main{margin:0;padding:18px 14px 100px}h1{font-size:25px}.card{padding:15px}#toast{bottom:84px}button{min-height:44px}button.sm{min-height:36px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<aside><div class="brand">◈ StudyHelper<small>v2 · your focus space</small></div><nav id="nav" aria-label="Main"></nav><div class="foot"><div id="foot">Saved on this device</div><div style="margin-top:8px">Concept and development by<br><b style="color:var(--text)">Keshan Panditharathna</b></div></div></aside>
<main><div class="top"><div><div class="eyebrow" id="eb"></div><h1 id="ttl"></h1></div><button class="sec" id="themeBtn" onclick="theme()" aria-label="Toggle theme">◐ Theme</button></div><div id="content"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id),KEY='studyhelper-v2';
const D=()=>new Date().toLocaleDateString('en-CA'),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const def=()=>({modules:[{id:1,name:'Advanced Mathematics',h:150,topics:[]},{id:2,name:'Information Assurance & Security',h:210,topics:[]},{id:3,name:'Mobile Application Development',h:30,topics:[]}],cards:[],exam:'2026-12-07',goal:120,logs:[],xp:0,rev:0,theme:'auto',auto:true,timer:{duration:1500,left:1500,end:null,mode:'Focus',mod:0}});
function norm(d){const b=def();const o={...b,...d,timer:{...b.timer,...(d.timer||{})}};o.modules.forEach((m,i)=>{m.h??=(i*67+150)%360;m.topics.forEach(t=>{t.lvl??=2;t.note??=''})});if(!Array.isArray(o.cards))o.cards=[];return o}
let s;try{s=norm(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('studyflow-v1')))}catch{s=def()}
let view='Dashboard',noteQ='',fm=0,rv={id:null,show:false},undoSnap=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));$('foot').textContent='● Saved on this device'}catch{$('foot').textContent='⚠ Storage unavailable — export your data'}}
const all=()=>s.modules.flatMap(m=>m.topics),pct=ts=>ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0;
const mins=d=>s.logs.filter(l=>l.day===d).reduce((a,l)=>a+l.minutes,0),today=()=>mins(D());
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${Math.round(Math.min(100,p))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,p)}%"></i></div>`;
const mod=id=>s.modules.find(m=>m.id===id),topic=(m,t)=>mod(m).topics.find(x=>x.id===t);
function streak(){const set=new Set(s.logs.map(l=>l.day));let i=set.has(D())?0:1,n=0;while(set.has(addD(-i))){n++;i++}return n}
function toast(msg,undo){const t=$('toast');t.innerHTML=esc(msg)+(undo?' <button onclick="undo()">Undo</button>':'');t.style.display='flex';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',undo?6000:2800)}
function snap(){undoSnap=JSON.stringify(s)}function undo(){if(undoSnap){s=norm(JSON.parse(undoSnap));undoSnap=null;save();render();toast('Restored')}}
function theme(){const o=['auto','light','dark'];s.theme=o[(o.indexOf(s.theme)+1)%3];applyTheme();save();toast('Theme: '+s.theme)}
function applyTheme(){if(s.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=s.theme}
const pages=[['dashboard','Dashboard','◈'],['tracker','Tracker','▤'],['focus','Focus','◷'],['notes','Notes','✎'],['cards','Cards','❏'],['recharge','Recharge','✳'],['settings','Settings','⚙']];
function go(v,q){view=v;if(q!==undefined)noteQ=q;stopBreath();const p=pages.find(p=>p[1]===v);if(location.hash!=='#'+p[0])history.replaceState(null,'','#'+p[0]);render();scrollTo(0,0)}
addEventListener('hashchange',()=>{const p=pages.find(p=>'#'+p[0]===location.hash);if(p&&p[1]!==view)go(p[1])});
function tips(){const t=[],u=all().filter(x=>!x.done),days=Math.max(0,Math.round((new Date(s.exam+'T00:00:00')-new Date(new Date().toDateString()))/864e5));
if(!all().length)t.push(['▤','Add your topics in the Tracker — a visible syllabus is the first step to finishing it.']);
if(u.length&&days>0)t.push(['📅','To finish by exam day, cover about '+Math.max(1,Math.ceil(u.length/days))+' topic(s) per day ('+u.length+' left, '+days+' days).']);
const ms=s.modules.filter(m=>m.topics.length).sort((a,b)=>pct(a.topics)-pct(b.topics))[0];if(ms&&pct(ms.topics)<100)t.push(['🎯','Weakest module: '+ms.name+' ('+pct(ms.topics)+'%). Give it your next session.']);
const h=u.filter(x=>x.lvl===3)[0];if(h)t.push(['🔥','Tackle a hard topic while fresh: '+h.name+'.']);
if(today()<s.goal)t.push(['◷',(s.goal-today())+' min left to hit today’s goal. One '+Math.min(25,s.goal-today())+'-minute session gets you moving.']);
const d=s.cards.filter(c=>c.next<=D()).length;if(d)t.push(['❏',d+' flashcard(s) due for review.']);
if(streak()>0)t.push(['🔥',streak()+'-day streak — study today to keep it alive.']);return t.slice(0,5)}
const V={
Dashboard(){const days=Math.max(0,Math.round((new Date(s.exam+'T00:00:00')-new Date(new Date().toDateString()))/864e5)),dn=all().filter(t=>t.done).length,wk=[...Array(7)].map((_,i)=>{const d=addD(i-6);return[d,mins(d)]}),mx=Math.max(30,...wk.map(w=>w[1]));
const ach=[[s.xp>=10,'First step'],[s.xp>=100,'Rising star'],[streak()>=3,'3-day streak'],[s.logs.length>=5,'Focus hero'],[dn>=10,'Topic master'],[s.rev>=20,'Card shark']];
return`<div class="hero"><div class="eyebrow">THE NEXT CHAPTER IS YOURS</div><h1>Small steps. Big results.</h1><p>One focused session today is a win for your future self.</p><button onclick="go('Focus')">Start focusing →</button></div>
<div class="grid">${[['Exam countdown',days+' days','Until '+esc(s.exam)],['Syllabus covered',pct(all())+'%',dn+' of '+all().length+' topics'],['Today’s focus',today()+' min','Goal: '+s.goal+' min'],['Level '+(1+Math.floor(s.xp/100)),s.xp+' XP','Streak: '+streak()+' day(s)']].map(a=>`<div class="card"><small>${a[0]}</small><div class="stat">${a[1]}</div><small>${a[2]}</small></div>`).join('')}</div>
<div class="grid"><div class="card"><h2>Smart suggestions</h2>${tips().map(t=>`<div class="tip"><span>${t[0]}</span><span>${esc(t[1])}</span></div>`).join('')||'<p>You’re all caught up. Nice work!</p>'}</div>
<div class="card"><h2>Last 7 days (min)</h2><div class="week">${wk.map(w=>`<div><span>${w[1]||''}</span><i style="height:${w[1]/mx*80}%"></i><span>${new Date(w[0]+'T00:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`).join('')}</div>${bar(today()/s.goal*100)}<small>${today()} / ${s.goal} min today</small></div></div>
<div class="grid"><div class="card"><h2>Module progress</h2>${s.modules.map(m=>`<div><span class="dot" style="background:hsl(${m.h} 60% 50%)"></span>${esc(m.name)} <small>${pct(m.topics)}%</small>${bar(pct(m.topics))}</div>`).join('')||'<p>No modules yet.</p>'}</div><div class="card"><h2>Achievements</h2>${ach.map(a=>`<span class="badge ${a[0]?'on':''}">${a[0]?'✓':'🔒'} ${a[1]}</span>`).join('')}<p>Level progress</p>${bar(s.xp%100)}</div></div>`},
Tracker(){return`<form class="row" onsubmit="addModule(event)"><input class="grow" id="mn" placeholder="New module name" aria-label="New module name" required><button>Add module</button></form>
${s.modules.length?'':'<div class="card empty">No modules yet. Add one above to start planning.</div>'}<div class="grid">${s.modules.map(m=>`<div class="card"><div class="row"><span class="dot" style="background:hsl(${m.h} 60% 50%)"></span><h3 class="grow">${esc(m.name)}</h3><button class="sec sm" onclick="renameModule(${m.id})" aria-label="Rename">✎</button><button class="dng sm" onclick="removeModule(${m.id})" aria-label="Delete module">✕</button></div><small>${m.topics.filter(t=>t.done).length}/${m.topics.length} done · ${pct(m.topics)}%</small>${bar(pct(m.topics))}
<form class="row" onsubmit="addTopic(event,${m.id})"><input class="grow" placeholder="Add a topic" aria-label="Add a topic" required><button aria-label="Add">+</button></form>
${m.topics.map(t=>`<div class="topic row"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${m.id},${t.id})" aria-label="Done: ${esc(t.name)}"><span class="grow ${t.done?'done':''}">${esc(t.name)}</span><button class="sec sm lv${t.lvl}" onclick="lvl(${m.id},${t.id})" title="Difficulty (tap to change)">${['','Easy','Medium','Hard'][t.lvl]}</button><button class="sec sm" onclick="go('Notes','${esc(t.name).replace(/'/g,'')}')" aria-label="Notes">${t.note?'📝':'✎'}</button><button class="dng sm" onclick="removeTopic(${m.id},${t.id})" aria-label="Delete topic">✕</button></div>`).join('')}</div>`).join('')}</div>`},
Focus(){const o=s.timer;return`<div class="card center"><div class="row center">${[['Focus',25],['Short break',5],['Long break',15]].map(a=>`<button class="${o.mode===a[0]?'':'sec'}" onclick="setTimer('${a[0]}',${a[1]})">${a[0]}</button>`).join('')}</div>
<div class="clock" id="clock" aria-live="off"></div><div class="row center"><select id="fmod" style="max-width:260px" onchange="s.timer.mod=+this.value;save()" aria-label="Module to study"><option value="0">No module</option>${s.modules.map(m=>`<option value="${m.id}" ${o.mod===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><p></p>
<div class="row center"><button id="start" onclick="startPause()"></button><button class="sec" onclick="resetTimer()">Reset</button></div><p>Press <b>Space</b> to start or pause. Put your phone away.</p>
<div class="row center"><input id="custom" type="number" min="1" max="180" placeholder="Custom minutes" style="width:160px" aria-label="Custom minutes"><button class="sec" onclick="customTimer()">Set focus</button><label class="row"><input type="checkbox" style="width:auto;min-height:0" ${s.auto?'checked':''} onchange="s.auto=this.checked;save()"> Auto-switch to break</label></div></div>
<div class="card" style="margin-top:14px"><h2>Recent sessions</h2>${s.logs.slice(-8).reverse().map(l=>`<p>${esc(l.day)} · ${l.minutes} min${l.m&&mod(l.m)?' · '+esc(mod(l.m).name):''}</p>`).join('')||'<p>Completed focus sessions will appear here.</p>'}</div>`},
Notes(){const q=noteQ.toLowerCase(),ms=s.modules.map(m=>({m,ts:m.topics.filter(t=>!q||(t.name+t.note).toLowerCase().includes(q))})).filter(x=>x.ts.length);
return`<input id="nq" type="search" placeholder="Search topics and notes…" value="${esc(noteQ)}" oninput="noteQ=this.value;$('nl').innerHTML=V.NL()" aria-label="Search notes"><div id="nl">${V.NL()}</div>`},
NL(){const q=noteQ.toLowerCase(),ms=s.modules.map(m=>({m,ts:m.topics.filter(t=>!q||(t.name+t.note).toLowerCase().includes(q))})).filter(x=>x.ts.length);
return ms.length?ms.map(x=>`<div class="card" style="margin:12px 0"><h2><span class="dot" style="background:hsl(${x.m.h} 60% 50%)"></span>${esc(x.m.name)}</h2>${x.ts.map(t=>`<div class="topic"><strong>${esc(t.name)}</strong> <small id="wc${t.id}">${t.note.trim()?t.note.trim().split(/\s+/).length:0} words</small><textarea placeholder="Key points, formulas, questions to revisit…" aria-label="Notes for ${esc(t.name)}" oninput="note(${x.m.id},${t.id},this.value)">${esc(t.note)}</textarea></div>`).join('')}</div>`).join(''):`<div class="card empty" style="margin-top:12px">${all().length?'No matches.':'Add topics in the Tracker first. '}<button onclick="go('Tracker')">Open tracker</button></div>`},
Cards(){const due=s.cards.filter(c=>c.next<=D()&&(!fm||c.m===fm)),c=s.cards.find(x=>x.id===rv.id)||due[0];if(c)rv.id=c.id;
return`<div class="card"><h2>Review <small>· ${due.length} due</small></h2><select onchange="fm=+this.value;rv={id:null,show:false};render()" aria-label="Filter module"><option value="0">All modules</option>${s.modules.map(m=>`<option value="${m.id}" ${fm===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
${c&&due.includes(c)?`<div class="fc">${esc(rv.show?c.a:c.q)}</div><div class="row center">${rv.show?`<button class="sec" onclick="rate(0)">Again</button><button onclick="rate(1)">Got it</button>`:`<button onclick="rv.show=true;render()">Show answer</button>`}</div>`:`<div class="empty">${s.cards.length?'🎉 Nothing due. Come back tomorrow!':'Create your first flashcard below.'}</div>`}</div>
<div class="card" style="margin-top:14px"><h2>New card</h2><form onsubmit="addCard(event)" class="grid" style="margin:0"><select id="cm" aria-label="Module"><option value="0">No module</option>${s.modules.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input id="cq" placeholder="Question" required aria-label="Question"><input id="ca" placeholder="Answer" required aria-label="Answer"><button>Add card</button></form></div>
${s.cards.length?`<div class="card" style="margin-top:14px"><h2>All cards (${s.cards.length})</h2>${s.cards.map(c=>`<div class="topic row"><span class="grow">${esc(c.q)} <small>· box ${c.box}</small></span><button class="dng sm" onclick="delCard(${c.id})" aria-label="Delete card">✕</button></div>`).join('')}</div>`:''}`},
Recharge(){return`<p>Rest is part of learning. Take a guilt-free break.</p><div class="grid"><div class="card center"><h2>Breathing space</h2><div class="orb" id="orb"></div><h3 id="bt">Ready to relax?</h3><p>Inhale 4s · Exhale 6s</p><div class="row center"><button onclick="startBreath()">Begin</button><button class="sec" onclick="stopBreath()">Stop</button></div></div><div class="card center"><h2>Memory match</h2><small>Find all 8 pairs</small><div class="game" id="game"></div><p id="gs" role="status"></p><button class="sec" onclick="newGame()">New game</button></div><div class="card center"><h2>Brain reset</h2><p id="ch">Look away from your screen and name five things you can see.</p><button onclick="challenge()">New activity</button></div></div>`},
Settings(){return`<div class="grid"><div class="card"><h2>Study preferences</h2><label>Next exam date<input type="date" value="${esc(s.exam)}" onchange="s.exam=this.value||s.exam;save()"></label><p></p><label>Daily goal (minutes)<input type="number" min="1" max="1440" value="${s.goal}" onchange="s.goal=Math.min(1440,Math.max(1,+this.value||120));save()"></label><p></p><button class="sec" onclick="theme()">Theme: ${s.theme}</button></div>
<div class="card"><h2>Your data</h2><p>Data stays in this browser. Export a backup before clearing storage. Old StudyFlow backups import too.</p><button onclick="backup()">Export backup</button><p>Restore a backup:</p><input type="file" accept=".json" onchange="restore(this)"><p><button class="dng" onclick="wipe()">Reset all data</button></p></div><div class="card"><h2>About</h2><p>StudyHelper v2</p><p>Concept and development by <b style="color:var(--text)">Keshan Panditharathna</b></p></div></div>`}};
function render(){$('nav').innerHTML=pages.map(p=>`<button class="${p[1]===view?'on':''}" onclick="go('${p[1]}')" ${p[1]===view?'aria-current="page"':''}><span class="i">${p[2]}</span>${p[1]}</button>`).join('');$('eb').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();$('ttl').textContent=view;$('content').innerHTML=V[view]();if(view==='Focus')tick();if(view==='Recharge')newGame()}
function addModule(e){e.preventDefault();const n=$('mn').value.trim();if(!n)return;s.modules.push({id:uid(),name:n,h:(s.modules.length*67+150)%360,topics:[]});save();render();toast('Module added')}
function renameModule(id){const n=prompt('Rename module',mod(id).name);if(n&&n.trim()){mod(id).name=n.trim();save();render()}}
function addTopic(e,id){e.preventDefault();const i=e.target.querySelector('input'),n=i.value.trim();if(!n)return;mod(id).topics.push({id:uid(),name:n,done:false,note:'',lvl:2});save();render();document.querySelectorAll('form input[placeholder="Add a topic"]').forEach(x=>{})}
function toggle(m,t){const x=topic(m,t);x.done=!x.done;if(x.done&&!x.rewarded){s.xp+=10;x.rewarded=true;toast('+10 XP · topic done')}save();render()}
function lvl(m,t){const x=topic(m,t);x.lvl=x.lvl%3+1;save();render()}
function note(m,t,v){topic(m,t).note=v;save();const w=$('wc'+t);if(w)w.textContent=(v.trim()?v.trim().split(/\s+/).length:0)+' words'}
function removeModule(id){snap();s.modules=s.modules.filter(m=>m.id!==id);s.cards=s.cards.filter(c=>c.m!==id);save();render();toast('Module deleted',1)}
function removeTopic(m,t){snap();mod(m).topics=mod(m).topics.filter(x=>x.id!==t);save();render();toast('Topic deleted',1)}
function addCard(e){e.preventDefault();s.cards.push({id:uid(),m:+$('cm').value,q:$('cq').value.trim(),a:$('ca').value.trim(),box:1,next:D()});save();render();toast('Card added')}
function delCard(id){snap();s.cards=s.cards.filter(c=>c.id!==id);save();render();toast('Card deleted',1)}
function rate(ok){const c=s.cards.find(x=>x.id===rv.id);if(!c)return;c.box=ok?Math.min(5,c.box+1):1;c.next=addD([0,1,3,7,14,30][ok?c.box:0]);s.rev++;if(ok)s.xp+=1;rv={id:null,show:false};save();render()}
function setTimer(mode,min){s.timer={...s.timer,mode,duration:min*60,left:min*60,end:null};save();render()}
function customTimer(){const n=+$('custom').value;if(n>=1&&n<=180)setTimer('Focus',Math.round(n));else toast('Enter 1–180 minutes')}
function resetTimer(){s.timer.left=s.timer.duration;s.timer.end=null;save();tick()}
function startPause(){const t=s.timer;if(t.end){t.left=Math.max(0,Math.ceil((t.end-Date.now())/1000));t.end=null}else{if(t.left<=0)t.left=t.duration;t.end=Date.now()+t.left*1000}save();tick()}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=660;o.start();o.stop(c.currentTime+.4)}catch{}}
function tick(){const t=s.timer;if(t.end){t.left=Math.max(0,Math.ceil((t.end-Date.now())/1000));if(t.left===0){t.end=null;beep();if(t.mode==='Focus'){s.logs.push({day:D(),minutes:Math.round(t.duration/60),m:t.mod||0});s.xp+=Math.max(1,Math.round(t.duration/60));toast('Session complete! +'+Math.max(1,Math.round(t.duration/60))+' XP');if(s.auto){setTimer('Short break',5);return}}else toast('Break over. Ready to focus?');save();render()}}
const f=String(Math.floor(t.left/60)).padStart(2,'0')+':'+String(t.left%60).padStart(2,'0');if($('clock')){$('clock').textContent=f;$('start').textContent=t.end?'Pause':'Start'}document.title=t.end?f+' · StudyHelper':'StudyHelper v2'}
setInterval(tick,250);
addEventListener('keydown',e=>{if(e.code==='Space'&&view==='Focus'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();startPause()}});
let br=null,bt=null;function startBreath(){stopBreath();const c=()=>{const o=$('orb');if(!o)return;o.style.transitionDuration='4s';o.classList.add('big');$('bt').textContent='Breathe in…';bt=setTimeout(()=>{if(!$('orb'))return;o.style.transitionDuration='6s';o.classList.remove('big');$('bt').textContent='Breathe out…'},4000)};c();br=setInterval(c,10000)}
function stopBreath(){clearInterval(br);clearTimeout(bt);if($('orb')){$('orb').classList.remove('big');$('bt').textContent='Ready to relax?'}}
let deck=[],op=[],mt=[],mv=0,lk=false,gv=0;
function newGame(){gv++;const e='🌙 ⭐ 🍀 🦋 🌈 🍎 🎈 🌻'.split(' ');deck=[...e,...e];for(let i=15;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}op=[];mt=[];mv=0;lk=false;draw()}
function draw(){if(!$('game'))return;$('game').innerHTML=deck.map((x,i)=>`<button aria-label="Card ${i+1}${op.includes(i)||mt.includes(i)?': '+x:''}" class="${mt.includes(i)?'m':''}" onclick="flip(${i})">${op.includes(i)||mt.includes(i)?x:'?'}</button>`).join('');$('gs').textContent=mt.length===16?'All matched in '+mv+' moves! +10 XP':mv+' moves'}
function flip(i){if(lk||mt.includes(i)||op.includes(i))return;op.push(i);if(op.length===2){mv++;if(deck[op[0]]===deck[op[1]]){mt.push(...op);op=[];if(mt.length===16){s.xp+=10;save()}}else{lk=true;const v=gv;setTimeout(()=>{if(v!==gv)return;op=[];lk=false;draw()},750)}}draw()}
function challenge(){const a=['Stretch your shoulders for 30 seconds.','Drink a glass of water.','Write down one thing you learned today from memory.','Count slowly backwards from 20 with eyes closed.','Walk around the room for one minute.','Name three things you are grateful for.','Look at a distant object for 20 seconds.'];$('ch').textContent=a[Math.floor(Math.random()*a.length)]}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='studyhelper-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(el){try{const d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.modules)||!Array.isArray(d.logs)||!d.modules.every(m=>Array.isArray(m.topics))||!Number.isFinite(d.xp))throw Error();if(confirm('Replace current data with this backup?')){snap();s=norm(d);save();applyTheme();render();toast('Backup restored',1)}}catch{toast('Invalid backup file')}}
function wipe(){if(confirm('Permanently delete all data?')){try{localStorage.removeItem(KEY)}catch{}s=def();applyTheme();save();render()}}
applyTheme();{const p=pages.find(p=>'#'+p[0]===location.hash);if(p)view=p[1]}save();render();
</script></body></html>
